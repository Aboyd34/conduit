<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Signal Not Found | Conduit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07060f; color: #e2e8f0;
      font-family: monospace;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      overflow: hidden;
    }
    .glow {
      position: fixed; top: 30%; left: 50%; transform: translateX(-50%);
      width: 500px; height: 300px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(124,58,237,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .code { font-size: clamp(80px, 20vw, 140px); font-weight: 900; color: #7c3aed; letter-spacing: -4px; line-height: 1; margin-bottom: 12px; text-shadow: 0 0 60px rgba(124,58,237,0.4); }
    .label { font-size: clamp(14px, 3vw, 20px); font-weight: 700; color: #a78bfa; letter-spacing: 4px; margin-bottom: 16px; }
    .msg { font-size: 14px; color: rgba(255,255,255,0.3); line-height: 1.7; max-width: 380px; margin-bottom: 40px; }
    .btn {
      display: inline-block; padding: 12px 32px; border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff; font-family: monospace; font-weight: 800;
      font-size: 13px; letter-spacing: 2px; text-decoration: none;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
      transition: box-shadow 0.2s;
    }
    .btn:hover { box-shadow: 0 6px 32px rgba(124,58,237,0.6); }
    .sub-links { margin-top: 20px; display: flex; gap: 20px; justify-content: center; }
    .sub-links a { font-size: 12px; color: rgba(255,255,255,0.2); text-decoration: none; }
    .sub-links a:hover { color: #a78bfa; }
    @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.7} 75%{opacity:0.9} }
    .code { animation: flicker 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="code">404</div>
  <div class="label">SIGNAL NOT FOUND</div>
  <p class="msg">The frequency you're tuned to doesn't exist.<br>It may have been removed, moved, or never existed.</p>
  <a href="/" class="btn">&#9889; BACK TO CONDUIT</a>
  <div class="sub-links">
    <a href="/faq.html">FAQ</a>
    <a href="/about.html">About</a>
    <a href="mailto:admin@conduitprotect.info">Support</a>
  </div>
</body>
</html>
