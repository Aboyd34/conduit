<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Conduit</title>
  <style>
    :root { --bg:#07070d; --accent:#7c6af7; --text:#e8e8f0; --muted:#888899; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; }
    .wrap { max-width:400px; }
    .logo img { width:64px; height:64px; object-fit:contain; margin-bottom:1.5rem; filter:drop-shadow(0 0 20px var(--accent)); }
    h1 { font-size:5rem; font-weight:900; color:var(--accent); line-height:1; margin-bottom:0.5rem; }
    p { color:var(--muted); margin-bottom:2rem; }
    a { display:inline-block; background:var(--accent); color:#fff; padding:0.75rem 1.75rem; border-radius:10px; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/logo.png" alt="Conduit" /></div>
    <h1>404</h1>
    <p>This signal got lost in the relay.</p>
    <a href="/">Back to Conduit</a>
  </div>
</body>
</html>
