services:
  - type: web
    name: conduit-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: VITE_API_URL
        value: https://conduit-api1.onrender.com
      - key: VITE_WS_URL
        value: wss://conduit-api1.onrender.com/ws
    healthCheckPath: /health
    autoDeploy: true
